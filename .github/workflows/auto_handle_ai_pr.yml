name: Auto Handle AI PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
jobs:
  handle:
    runs-on: ubuntu-latest
    steps:
      - name: Check if branch starts with 'Copilot-'
        if: startsWith(github.event.pull_request.head.ref, 'Copilot-')
        run: echo 'Handling PR from Copilot branch.'
      - name: Run your action
        run: echo 'This is where your action logic goes.'